name: Release Tauri

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: release-linux-x64
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-2022
            artifact_name: release-windows-x64
            bundles: nsis,msi
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-15
            artifact_name: release-macos
            bundles: dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deps-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache Rust and sidecar build outputs
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/target/
            !src-tauri/target/release/bundle/
          key: ${{ runner.os }}-${{ runner.arch }}-build-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**/*.rs', 'src-tauri/sidecars/**/*.cpp', 'src-tauri/sidecars/**/*.h', 'src-tauri/sidecars/**/CMakeLists.txt', 'src-tauri/tauri.conf.json', 'scripts/**/*.mjs', 'profile.ini') }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node --print "require('./package.json').version")"
          cargo_version="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | node --input-type=module --eval 'let input = ""; for await (const chunk of process.stdin) input += chunk; const metadata = JSON.parse(input); if (metadata.packages.length !== 1) throw new Error(`Expected one Cargo package, found ${metadata.packages.length}`); console.log(metadata.packages[0].version);')"
          if [[ "${package_version}" != "${cargo_version}" ]]; then
            echo "package.json version ${package_version} does not match Cargo version ${cargo_version}." >&2
            exit 1
          fi
          expected_tag="v${cargo_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected_tag}." >&2
            exit 1
          fi

      - name: Build release bundles
        run: npm run build:tauri -- --bundles "${{ matrix.bundles }}"
        env:
          CI: "true"

      - name: Store release bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          mapfile -d '' release_files < <(find . -type f ! -name SHA256SUMS -print0 | sort -z)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release files found for checksum generation." >&2
            exit 1
          fi
          sha256sum "${release_files[@]}" > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: CADGEN-AX ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/SHA256SUMS
