name: Release Tauri

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: release-linux-x64
            bundles: deb,appimage
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-2022
            artifact_name: release-windows-x64
            bundles: nsis,msi
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-15
            artifact_name: release-macos
            bundles: dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          cargo_version="$(node --input-type=module --eval 'import { readFileSync } from "node:fs"; const manifest = readFileSync("src-tauri/Cargo.toml", "utf8"); const section = manifest.split(/^\[package\]\s*$/m)[1]?.split(/^\[/m)[0]; const version = section?.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1]; if (!version) throw new Error("Cargo package version is missing"); console.log(version);')"
          if [[ "${package_version}" != "${cargo_version}" ]]; then
            echo "package.json version ${package_version} does not match Cargo version ${cargo_version}." >&2
            exit 1
          fi
          expected_tag="v${cargo_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}." >&2
            exit 1
          fi

      - name: Build release bundles
        run: npm run build:tauri -- --bundles "${{ matrix.bundles }}"
        env:
          CI: "true"

      - name: Store release bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Cadastrophe ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.AppImage
